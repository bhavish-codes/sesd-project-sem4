name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check & Build
        run: npm run build

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gitanalyser
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './gitanalyser/package-lock.json'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Lint Check
        run: npm run lint

      - name: Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://sesd-project-sem4.vercel.app
